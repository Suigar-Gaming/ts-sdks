packages:
  - 'packages/*'
  - 'playground'
  - '!**/dist/**'
  - '!**/.next/**'

catalogs:
  mysten:
    '@mysten/bcs': '^2.0.5'
    '@mysten/codegen': '^0.10.6'
    '@mysten/sui': '^2.17.0'
  test:
    'vitest': '^4.1.9'
  tooling:
    'eslint-config-prettier': '^10.1.8'
    'prettier': '^3.8.4'
    'tsdown': '^0.22.2'
    'tsx': '^4.22.4'
  typescript:
    '@types/node': '^24.0.0'
    'typescript': '^5.9.3'

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: true

blockExoticSubdeps: true

minimumReleaseAge: 2880
