packages:
  - packages/*
  - examples/*
  - playground

catalogs:
  frontend:
    'clsx': ^2.1.1
    'react': ^19.3.1
    'react-dom': ^19.3.1
    'tailwind-merge': ^3.7.0
  mysten:
    '@mysten/bcs': ^2.1.4
    '@mysten/codegen': ^0.12.24
    '@mysten/sui': ^2.39.1
  tooling:
    '@tailwindcss/postcss': ^4.3.5
    '@tailwindcss/vite': ^4.3.5
    'happy-dom': ^21.0.4
    'react-doctor': ^0.9.22
    'tailwindcss': ^4.3.5
    'tsdown': ^0.23.7
    'vite': ^8.3.6
    'vitest': ^5.1.0
  typescript:
    '@types/node': ^24.19.2
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    'typescript': ^7.0.2

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@mysten/*'

update:
  changeset: true
  githubActions: true

peerDependencyRules:
  allowAny:
    - '@opentelemetry/api'
    - typescript
  ignoreMissing:
    - eslint
