packages:
  - packages/*
  - playground
  - '!**/dist/**'
  - '!**/.next/**'

catalogs:
  frontend:
    'clsx': ^2.1.1
    'react': ^19.2.7
    'react-dom': ^19.2.7
    'tailwind-merge': ^3.6.0
  mysten:
    '@mysten/bcs': ^2.1.0
    '@mysten/codegen': ^0.11.5
    '@mysten/sui': ^2.20.3
  test:
    'vitest': ^4.1.10
  tooling:
    '@tailwindcss/postcss': ^4.3.2
    '@tailwindcss/vite': ^4.3.2
    'eslint-config-prettier': ^10.1.8
    'prettier': ^3.9.5
    'react-doctor': ^0.7.3
    'tailwindcss': ^4.3.2
    'tsdown': ^0.22.4
    'tsx': ^4.23.0
  typescript:
    '@types/node': ^24.0.0
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    'typescript': ^5.9.3
  typescript6:
    'typescript': ^6.0.3

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'
