packages:
  - 'packages/*'
  - 'apps/*'
  - '!**/dist/**'
  - '!**/.next/**'

catalogs:
  mysten:
    '@mysten/bcs': '^2.0.5'
    '@mysten/sui': '^2.17.0'
  typescript:
    '@types/node': '^24.0.0'
    'typescript': '^5.9.3'

allowBuilds:
  {
    esbuild: false,
    msgpackr-extract: false,
    sharp: false,
    unrs-resolver: false,
  }
autoInstallPeers: true

blockExoticSubdeps: true

minimumReleaseAge: 2880
