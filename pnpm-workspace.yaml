packages:
  - packages/*
  - playground
  - '!**/dist/**'
  - '!**/.next/**'

catalogs:
  frontend:
    'clsx': ^2.1.1
    'react': ^19.2.8
    'react-dom': ^19.2.8
    'tailwind-merge': ^3.6.0
  mysten:
    '@mysten/bcs': ^2.1.1
    '@mysten/codegen': ^0.12.3
    '@mysten/sui': ^2.26.2
  test:
    'vitest': ^4.1.10
  tooling:
    '@tailwindcss/postcss': ^4.3.3
    '@tailwindcss/vite': ^4.3.3
    'oxfmt': ^0.63.0
    'react-doctor': ^0.9.12
    'tailwindcss': ^4.3.3
    'tsdown': ^0.22.14
  typescript:
    '@types/node': ^24.0.0
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
    'typescript': ^7.0.2

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'

overrides:
  'postcss': 8.5.26
  'sharp': 0.35.3

peerDependencyRules:
  allowAny:
    - graphql
    - typescript
  ignoreMissing:
    - eslint
