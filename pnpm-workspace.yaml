packages:
  - packages/*
  - playground
  - '!**/dist/**'
  - '!**/.next/**'

catalogs:
  mysten:
    '@mysten/bcs': ^2.1.0
    '@mysten/codegen': ^0.11.1
    '@mysten/sui': ^2.19.0
  test:
    'vitest': ^4.1.9
  tooling:
    'eslint-config-prettier': ^10.1.8
    'prettier': ^3.8.4
    'tsdown': ^0.22.3
    'tsx': ^4.22.4
  typescript:
    '@types/node': ^24.0.0
    'typescript': ^5.9.3
  typescript6:
    'typescript': ^6.0.3

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'
