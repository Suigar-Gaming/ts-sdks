packages:
  - packages/*
  - playground

catalogs:
  frontend:
    'clsx': ^2.1.1
    'react': ^19.3.1
    'react-dom': ^19.3.1
    'tailwind-merge': ^3.7.0
  mysten:
    '@mysten/bcs': ^2.1.2
    '@mysten/codegen': ^0.12.19
    '@mysten/sui': ^2.36.0
  test:
    'vitest': ^5.0.5
  tooling:
    '@tailwindcss/postcss': ^4.3.3
    '@tailwindcss/vite': ^4.3.3
    'react-doctor': ^0.9.18
    'tailwindcss': ^4.3.3
    'tsdown': ^0.23.1
  typescript:
    '@types/node': ^24.19.2
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    'typescript': ^7.0.2

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'

update:
  changeset: true
  githubActions: true

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces stack-exhaustion denial of service
