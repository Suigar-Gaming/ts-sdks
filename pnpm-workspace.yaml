packages:
  - packages/*
  - playground

catalogs:
  frontend:
    'clsx': ^2.1.1
    'react': ^19.3.0
    'react-dom': ^19.3.0
    'tailwind-merge': ^3.7.0
  mysten:
    '@mysten/bcs': ^2.1.1
    '@mysten/codegen': ^0.12.11
    '@mysten/sui': ^2.31.2
  test:
    'vitest': ^5.0.0
  tooling:
    '@tailwindcss/postcss': ^4.3.3
    '@tailwindcss/vite': ^4.3.3
    'react-doctor': ^0.9.14
    'tailwindcss': ^4.3.3
    'tsdown': ^0.23.0
  typescript:
    '@types/node': ^24.13.4
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    'typescript': ^7.0.2

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'

update:
  changeset: true
  githubActions: true

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint
