packages:
  - packages/*
  - playground
  - '!**/dist/**'
  - '!**/.next/**'

catalogs:
  frontend:
    'clsx': ^2.1.1
    'react': ^19.2.7
    'react-dom': ^19.2.7
    'tailwind-merge': ^3.6.0
  mysten:
    '@mysten/bcs': ^2.1.0
    '@mysten/codegen': ^0.11.7
    '@mysten/sui': ^2.21.0
  test:
    'vitest': ^4.1.10
  tooling:
    '@tailwindcss/postcss': ^4.3.2
    '@tailwindcss/vite': ^4.3.2
    'prettier': ^3.9.5
    'react-doctor': ^0.7.7
    'tailwindcss': ^4.3.2
    'tsdown': ^0.22.7
    'tsx': ^4.23.1
  typescript:
    '@types/node': ^24.0.0
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    'typescript': ^6.0.3

allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

autoInstallPeers: false

blockExoticSubdeps: true

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - '@mysten/*'

auditConfig:
  ignoreGhsas:
    - GHSA-qx2v-qp2m-jg93

peerDependencyRules:
  ignoreMissing:
    - eslint
