name: Setup pnpm
description: Setup the workspace Node.js and pnpm environment.

inputs:
  cache:
    description: Enable pnpm dependency caching.
    required: false
    default: 'true'
  doctor:
    description: Run pnpm diagnostics after pnpm setup.
    required: false
    default: 'true'
  install:
    description: Install workspace dependencies from the repository root.
    required: false
    default: 'true'
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        cache: ${{ inputs.cache }}
        install: false
        require-lockfile: true
        runtime: node@${{ inputs.node-version }}

    - name: Run pnpm installation diagnostics
      if: inputs.doctor == 'true'
      shell: bash
      run: pnpm doctor

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
