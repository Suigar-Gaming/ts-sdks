name: Setup pnpm
description: Setup the workspace Node.js and pnpm environment.

inputs:
  cache:
    description: Enable pnpm dependency caching.
    required: false
    default: 'true'
  doctor:
    description: Run pnpm diagnostics after pnpm setup.
    required: false
    default: 'true'
  install:
    description: Install workspace dependencies from the repository root.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: ${{ inputs.cache }}
        install: false
        require-lockfile: true

    - name: Run pnpm installation diagnostics
      if: inputs.doctor == 'true'
      shell: bash
      run: pnpm doctor

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
