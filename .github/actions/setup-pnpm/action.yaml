name: Setup pnpm
description: Setup the workspace Node.js and pnpm environment.

inputs:
  cache:
    description: Enable pnpm dependency caching.
    required: false
    default: 'true'
  doctor:
    description: Run pnpm diagnostics after pnpm setup.
    required: false
    default: 'true'
  install:
    description: Install workspace dependencies from the repository root.
    required: false
    default: 'true'
  node-version:
    description: Node.js version to install.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        cache: ${{ inputs.cache }}
        install: false
        runtime: node@${{ inputs.node-version }}

    - name: Run pnpm installation diagnostics
      if: inputs.doctor == 'true'
      shell: bash
      run: pnpm doctor

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
