name: Publish to NPM

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/setup-node-pnpm/action.yml
      - packages/**/package.json
      - packages/**/CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      released_packages: ${{ steps.release.outputs.released_packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'
          registry-url: https://registry.npmjs.org

      - name: Detect release commit
        id: release
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');

          let releasedDirs = [];

          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            const packageJsonPaths = execSync('git ls-files "packages/*/package.json"', { encoding: 'utf8' })
              .trim()
              .split('\n')
              .filter(Boolean);

            releasedDirs = packageJsonPaths.map((file) => file.replace(/\/package\.json$/, ''));
          } else {
            const changedFiles = execSync('git diff --name-only HEAD^ HEAD', { encoding: 'utf8' })
              .trim()
              .split('\n')
              .filter(Boolean);

            const pkgJsonDirs = new Set();
            const changelogDirs = new Set();

            for (const file of changedFiles) {
              const packageJsonMatch = file.match(/^(packages\/[^/]+)\/package\.json$/);
              if (packageJsonMatch) {
                pkgJsonDirs.add(packageJsonMatch[1]);
              }

              const changelogMatch = file.match(/^(packages\/[^/]+)\/CHANGELOG\.md$/);
              if (changelogMatch) {
                changelogDirs.add(changelogMatch[1]);
              }
            }

            releasedDirs = [...pkgJsonDirs].filter((dir) => changelogDirs.has(dir));
          }

          const releasedPackages = releasedDirs.map((dir) => {
            const pkg = JSON.parse(readFileSync(join(dir, 'package.json'), 'utf8'));
            return {
              dir,
              name: pkg.name,
              version: pkg.version,
            };
          });

          process.stdout.write(`should_publish=${releasedPackages.length > 0}\n`);
          process.stdout.write(`released_packages=${JSON.stringify(releasedPackages)}\n`);
          NODE

      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org

      - name: Build packages
        if: steps.release.outputs.should_publish == 'true'
        run: pnpm turbo run build:ci --filter='./packages/*'

      - name: Check package contents
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASED_PACKAGES: ${{ steps.release.outputs.released_packages }}
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process');

          const releasedPackages = JSON.parse(process.env.RELEASED_PACKAGES);
          for (const pkg of releasedPackages) {
            execSync('pnpm pack --dry-run', {
              cwd: pkg.dir,
              stdio: 'inherit',
            });
          }
          NODE

      - name: Publish to npm
        if: steps.release.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ''
        run: pnpm release

      - name: Skip publish
        if: steps.release.outputs.should_publish != 'true'
        run: echo "No release changes detected; skipping npm publish."

  deprecate:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.should_publish == 'true'
    uses: ./.github/workflows/deprecate-previous-release.yml
    secrets:
      npm_deprecate_token: ${{ secrets.NPM_DEPRECATE_TOKEN }}
    with:
      released_packages: ${{ needs.publish.outputs.released_packages }}
