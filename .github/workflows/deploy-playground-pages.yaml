name: Deploy Playground Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-pnpm/action.yaml'
      - '.github/workflows/deploy-playground-pages.yaml'
      - 'package.json'
      - 'packages/sdk/**'
      - 'playground/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.shared.json'
      - 'turbo.json'
  pull_request:
    paths:
      - '.github/actions/setup-pnpm/action.yaml'
      - '.github/workflows/deploy-playground-pages.yaml'
      - 'package.json'
      - 'packages/sdk/**'
      - 'playground/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.shared.json'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playground-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Configure GitHub Pages
        id: github-pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build playground site
        shell: bash
        run: pnpm turbo run build --filter='./playground'
        env:
          BASE_PATH: ${{ steps.github-pages.outputs.base_path }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: playground-pages-${{ github.run_number }}
          path: playground/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: playground-pages-${{ github.run_number }}
