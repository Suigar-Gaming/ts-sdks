name: Deprecate previous NPM release

on:
  workflow_call:
    inputs:
      released_packages:
        required: true
        type: string
    secrets:
      npm_deprecate_token:
        required: false

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'
          registry-url: https://registry.npmjs.org

      - name: Deprecate previous release
        shell: bash
        env:
          RELEASED_PACKAGES: ${{ inputs.released_packages }}
          NODE_AUTH_TOKEN: ${{ secrets.npm_deprecate_token }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_DEPRECATE_TOKEN is not configured; skipping deprecation."
            exit 0
          fi

          node <<'NODE'
          const { execSync } = require('node:child_process');

          const releasedPackages = JSON.parse(process.env.RELEASED_PACKAGES);

          for (const { name, version } of releasedPackages) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/);
            if (!match) {
              continue;
            }

            const [, major, minor, patch, prerelease] = match;
            if (prerelease) {
              continue;
            }

            const previousPatch = Number(patch) - 1;
            if (previousPatch < 0) {
              continue;
            }

            const previousVersion = `${major}.${minor}.${previousPatch}`;

            try {
              execSync(`npm view "${name}@${previousVersion}" version`, { stdio: 'ignore' });
            } catch {
              console.log(`Version ${name}@${previousVersion} not found on npm; skipping deprecation.`);
              continue;
            }

            try {
              execSync(
                `npm deprecate "${name}@${previousVersion}" "Deprecated in favor of ${name}@${version}"`,
                { stdio: 'inherit' },
              );
              console.log(`Deprecated ${name}@${previousVersion}.`);
            } catch {
              console.log(`Deprecation failed for ${name}@${previousVersion}; continuing without failing publish.`);
            }
          }
          NODE
