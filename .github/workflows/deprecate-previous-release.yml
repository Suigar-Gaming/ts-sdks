name: Deprecate previous NPM release

on:
  workflow_run:
    workflows:
      - Changesets
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deprecate-previous-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deprecate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'

      - name: Detect released packages
        id: release
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');

          const changedFiles = execSync('git diff --name-only HEAD^ HEAD', { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean);

          const pkgJsonDirs = new Set();
          const changelogDirs = new Set();

          for (const file of changedFiles) {
            const packageJsonMatch = file.match(/^(packages\/[^/]+)\/package\.json$/);
            if (packageJsonMatch) {
              pkgJsonDirs.add(packageJsonMatch[1]);
            }

            const changelogMatch = file.match(/^(packages\/[^/]+)\/CHANGELOG\.md$/);
            if (changelogMatch) {
              changelogDirs.add(changelogMatch[1]);
            }
          }

          const releasedDirs = [...pkgJsonDirs].filter((dir) => changelogDirs.has(dir));
          const releasedPackages = releasedDirs.map((dir) => {
            const pkg = JSON.parse(readFileSync(join(dir, 'package.json'), 'utf8'));
            return {
              dir,
              name: pkg.name,
              version: pkg.version,
            };
          });

          process.stdout.write(`should_deprecate=${releasedPackages.length > 0}\n`);
          process.stdout.write(`released_packages=${JSON.stringify(releasedPackages)}\n`);
          NODE

      - name: Skip deprecation
        if: steps.release.outputs.should_deprecate != 'true'
        run: echo "No published release packages detected; skipping deprecation."

      - name: Deprecate previous release
        if: steps.release.outputs.should_deprecate == 'true'
        shell: bash
        env:
          RELEASED_PACKAGES: ${{ steps.release.outputs.released_packages }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_DEPRECATE_TOKEN is not configured; skipping deprecation."
            exit 0
          fi

          node <<'NODE'
          const { execSync } = require('node:child_process');

          const releasedPackages = JSON.parse(process.env.RELEASED_PACKAGES);

          for (const { name, version } of releasedPackages) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/);
            if (!match) {
              continue;
            }

            const [, major, minor, patch, prerelease] = match;
            if (prerelease) {
              continue;
            }

            const previousPatch = Number(patch) - 1;
            if (previousPatch < 0) {
              continue;
            }

            const previousVersion = `${major}.${minor}.${previousPatch}`;

            try {
              execSync(`npm view "${name}@${previousVersion}" version`, { stdio: 'ignore' });
            } catch {
              console.log(`Version ${name}@${previousVersion} not found on npm; skipping deprecation.`);
              continue;
            }

            try {
              execSync(
                `npm deprecate "${name}@${previousVersion}" "Deprecated in favor of ${name}@${version}"`,
                { stdio: 'inherit' },
              );
              console.log(`Deprecated ${name}@${previousVersion}.`);
            } catch {
              console.log(`Deprecation failed for ${name}@${previousVersion}; continuing without failing publish.`);
            }
          }
          NODE
