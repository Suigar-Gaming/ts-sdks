name: Changesets

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published_packages: ${{ steps.changesets.outputs['published-packages'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run release
          commit-message: 'ci: version packages'
          pr-title: 'ci: version packages'

  publish-mcp-registry:
    needs: release
    if: >-
      needs.release.outputs.published == 'true' && contains(fromJSON(needs.release.outputs.published_packages || '[]').*.name, '@suigar/mcp')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yaml
