name: Publish MCP Registry

# Changesets creates package-scoped tags (for example, @suigar/mcp@1.0.0).
# This reusable workflow is called only when Changesets reports publishing
# @suigar/mcp, so SDK-only releases and release-PR creation do not invoke it.
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the Changesets MCP release tag
        shell: bash
        run: |
          PACKAGE_VERSION="$(jq --raw-output '.version' packages/mcp/package.json)"
          RELEASE_TAG="@suigar/mcp@${PACKAGE_VERSION}"

          git tag --points-at "$GITHUB_SHA" | grep --fixed-strings --line-regexp "$RELEASE_TAG"

      - name: Install MCP Registry publisher
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar -xz mcp-publisher

      - name: Authenticate to MCP Registry
        shell: bash
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP server manifest
        working-directory: packages/mcp
        shell: bash
        run: ../../mcp-publisher publish
