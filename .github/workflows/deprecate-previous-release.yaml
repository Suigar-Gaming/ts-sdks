name: Deprecate previous NPM release

on:
  workflow_run:
    workflows:
      - Changesets
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deprecate-previous-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deprecate:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          install: 'false'

      - name: Detect released packages
        id: release
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BEFORE_SHA=$(git rev-parse "$HEAD_SHA^")

          RELEASED_DIRS=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | grep -E '/(package\.json|CHANGELOG\.md)$' | sed -E 's/\/(package\.json|CHANGELOG\.md)$//' | sort | uniq -c | awk '$1==2 {print $2}')

          RELEASED_PACKAGES="[]"

          if [ -n "$RELEASED_DIRS" ]; then
            RELEASED_PACKAGES=$(
              for dir in $RELEASED_DIRS; do
                git show "$HEAD_SHA:$dir/package.json" | jq -c --arg dir "$dir" '{dir: $dir, name: .name, version: .version}'
              done | jq -s -c '.'
            )
          fi

          SHOULD_DEPRECATE=$([ "$RELEASED_PACKAGES" != "[]" ] && echo "true" || echo "false")

          echo "should_deprecate=$SHOULD_DEPRECATE" >> "$GITHUB_OUTPUT"
          echo "released_packages=$RELEASED_PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Skip deprecation
        if: steps.release.outputs.should_deprecate != 'true'
        run: echo "No published release packages detected; skipping deprecation."

      - name: Deprecate previous release
        if: steps.release.outputs.should_deprecate == 'true'
        shell: bash
        env:
          RELEASED_PACKAGES: ${{ steps.release.outputs.released_packages }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEPRECATE_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_DEPRECATE_TOKEN is not configured; skipping deprecation."
            exit 0
          fi

          echo "$RELEASED_PACKAGES" | jq -c '.[]' | while read -r pkg; do
            NAME=$(echo "$pkg" | jq -r '.name')
            VERSION=$(echo "$pkg" | jq -r '.version')

            if [[ "$VERSION" =~ [-+] ]]; then
              continue
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PREVIOUS_PATCH=$((PATCH - 1))
            if [ "$PREVIOUS_PATCH" -lt 0 ]; then
              continue
            fi

            PREVIOUS_VERSION="$MAJOR.$MINOR.$PREVIOUS_PATCH"

            if ! npm view "${NAME}@${PREVIOUS_VERSION}" version &>/dev/null; then
              echo "Version ${NAME}@${PREVIOUS_VERSION} not found on npm; skipping deprecation."
              continue
            fi

            if npm deprecate "${NAME}@${PREVIOUS_VERSION}" "Deprecated in favor of ${NAME}@${VERSION}"; then
              echo "Deprecated ${NAME}@${PREVIOUS_VERSION}."
            else
              echo "Deprecation failed for ${NAME}@${PREVIOUS_VERSION}; continuing without failing publish."
            fi
          done
